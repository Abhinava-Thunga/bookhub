<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BookHub</title>

  <style>

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #1d3557, #457b9d);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-btn {
      background: #e63946;
      border: none;
      padding: 10px 15px;
      color: white;
      border-radius: 20px;
      cursor: pointer;
    }

    /* GRID */
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      padding: 20px;
      gap: 20px;
    }

    /* CARD */
    .card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .price { color: green; }
    .stock { color: #555; }
    .cart-info { color: red; }

    /* INPUT */
    input {
      width: 60px;
      font-size: 13px;
      font-weight: 300;
      text-align: center;
    }

    /* BUTTON */
    button {
      margin-top: 8px;
      padding: 8px;
      border: none;
      background: #1d3557;
      color: white;
      cursor: pointer;
    }

    /* CART PANEL */
    #cartPanel {
      position: fixed;
      right: -400px;
      top: 0;
      width: 350px;
      height: 100%;
      background: white;
      padding: 20px;
      transition: 0.3s;
    }

    #cartPanel.active {
      right: 0;
    }

  </style>
</head>

<body>

<header>
  <h1>📚 BookHub</h1>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<div id="books" class="container"></div>

<!-- CART -->
<div id="cartPanel">
  <h2>Cart</h2>
  <div id="cart"></div>
  <h3 id="total"></h3>
  <button onclick="placeOrder()">Place Order</button>
</div>

<!-- ORDER HISTORY -->
<h2 style="text-align:center">📦 Order History</h2>
<div id="orders"></div>

<script>

  const userId = "user1";

  // LOAD BOOKS
  async function loadBooks() {

    let res = await fetch("http://localhost:8080/books");
    let data = await res.json();

    let cartRes = await fetch("http://localhost:8080/cart");
    let cart = await cartRes.json();

    let cartMap = {};
    cart.forEach(c => cartMap[c.book.id] = c.quantity);

    let html = "";

    data.data.forEach(b => {

      let cartQty = cartMap[b.id] || 0;

      html += `
    <div class="card">
      <img src="${b.imageUrl}">
      <h3>${b.title}</h3>
      <p>${b.author}</p>
      <p class="price">₹${b.price}</p>
      <p class="stock">Stock: ${b.quantity}</p>
      <p class="cart-info">In Cart: ${cartQty}</p>

      <input type="number" id="qty-${b.id}" placeholder="qty">

      <button onclick="addToCart(${b.id}, ${b.quantity})">
        Add
      </button>
    </div>`;
    });

    document.getElementById("books").innerHTML = html;
  }

  // ADD TO CART
  async function addToCart(id, stock) {

    let qty = parseInt(document.getElementById("qty-" + id).value);

    if (!qty || qty <= 0) return alert("Enter qty");

    if (qty > stock) return alert("Not enough stock");

    await fetch(`http://localhost:8080/cart/${id}/${qty}`, { method: "POST" });

    let name = document.querySelector(`#qty-${id}`)
            .closest(".card")
            .querySelector("h3").innerText;

    alert(`${qty} × ${name} added`);

    loadBooks();
    loadCart();
  }

  // LOAD CART
  async function loadCart() {

    let res = await fetch("http://localhost:8080/cart");
    let cart = await res.json();

    let html = "";
    let total = 0;
    let count = 0;

    cart.forEach(item => {
      total += item.book.price * item.quantity;
      count += item.quantity;

      html += `${item.book.title} × ${item.quantity}<br>`;
    });

    document.getElementById("cart").innerHTML = html;
    document.getElementById("total").innerText = "₹" + total;
    document.getElementById("cartCount").innerText = count;
  }

  // PLACE ORDER
  async function placeOrder() {

    let res = await fetch(`http://localhost:8080/orders/${userId}`, {
      method: "POST"
    });

    if (!res.ok) return alert("Error");

    alert("Order placed");

    document.getElementById("cartPanel").classList.remove("active");

    loadBooks();
    loadCart();
    loadOrders();
  }

  // LOAD ORDERS
  async function loadOrders() {

    let res = await fetch(`http://localhost:8080/orders/${userId}`);
    let data = await res.json();

    let html = "";

    data.data.forEach(o => {
      html += `<div style="margin:10px;padding:10px;background:white;">
      Order #${o.id} - ₹${o.totalPrice}
    </div>`;
    });

    document.getElementById("orders").innerHTML = html;
  }

  // TOGGLE CART
  function toggleCart() {
    document.getElementById("cartPanel").classList.toggle("active");
    loadCart();
  }

  // INIT
  loadBooks();
  loadCart();
  loadOrders();

</script>

</body>
</html>
